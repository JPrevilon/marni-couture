        <stop offset=".48" stop-color="#0A0A0E"/>
        <stop offset="1" stop-color="#FF2F9A" stop-opacity=".72"/>
      </linearGradient>
      <linearGradient id="fabric" x1="320" y1="190" x2="610" y2="1040" gradientUnits="userSpaceOnUse">
