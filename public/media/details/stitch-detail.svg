<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="900" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2F9A" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#09090D"/>
      <stop offset="1" stop-color="#824CFF" stop-opacity=".82"/>
    </linearGradient>
    <filter id="wave">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .05" numOctaves="2" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="700" rx="44" fill="url(#base)"/>
  <g filter="url(#wave)" opacity=".78">
    <path d="M-30 130C180 35 350 240 540 125c140-86 260-55 410 40" stroke="#fff" stroke-opacity=".56" stroke-width="34"/>
    <path d="M-30 310C170 210 350 425 560 300c130-76 250-48 390 55" stroke="#FF2F9A" stroke-width="70" stroke-opacity=".7"/>
    <path d="M-20 520C190 420 355 615 565 500c135-75 245-55 380 35" stroke="#824CFF" stroke-width="46" stroke-opacity=".84"/>
  </g>
  <rect width="900" height="700" rx="44" filter="url(#grain)" opacity=".34"/>
</svg>
